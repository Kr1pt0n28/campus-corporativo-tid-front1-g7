<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="/modulo-1-autenticacion-y-registro/src/styles/styles.css">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <title>Registro</title>
</head>
<body>

    <main>
        <section class="titulo" id="registro">
            <header>
                <h1>Crear cuenta</h1>
            </header>

            <form id="form-registro">
                
                <div class="campo">
                    <input type="text" id="nombre" name="nombre" placeholder="Escribe tu nombre completo" required>
                </div>

                <div class="campo">
                    <input type="email" id="email" name="email" placeholder="nombre@correo.com" required>
                </div>

                <div class="campo">
                    <input type="password" id="password" name="password" placeholder="Crea una contraseña" required>
                </div>

                <div class="campo">
                    <input type="password" id="confirmar" name="confirmar" placeholder="Repite tu contraseña" required>
                </div>

                <div class="boton">
                    <input id="btnRegister" type="submit" value="Registro">
                </div>
            </form>

            <p class="link">¿Ya tienes una cuenta? 
                <a href="/modulo-1-autenticacion-y-registro/src/pages/login.html">Inicia sesión aquí</a>
            </p>
        </section>
    </main>

    <footer class="pie">
        <p>
            Grupo Stella © 2025
        </p>
    </footer>

    <script type="module" src="/modulo-1-autenticacion-y-registro/src/controllers/controllerRegistro.js"></script>
</body>
</html>
