<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="/modulo-1-autenticacion-y-registro/src/styles/styles.css">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <title>Inciar Sesion</title>
</head>

<body>
        
    <header>
        
    </header>
    <main>
        <section class="titulo" id="registro">
            <h1>Iniciar Sesion</h1>
            <form id="form-registro">

                <section class="grupo-campos">
                    <div class="campo">
                        <input type="email" id="email" name="email" placeholder="nombre@correo.com" required>
                    </div>

                    <div class="campo">
                        <input type="password" id="password" name="password" placeholder="Contraseña" required>
                    </div>
                </section>

                <div class="boton">
                    <input id="btnLogin" type="submit" value="Iniciar">
                </div>
            </form>

            <div class="link">
                <a href="/modulo-1-autenticacion-y-registro/src/pages/registro.html">Registrarse</a>
            </div>

            <div class="link">
                <a href="/modulo-1-autenticacion-y-registro/src/pages/reestablecimiento.html">¿Olvidaste tu contraseña?</a>
            </div>
        </section>
    </main>

    <footer class="pie">
        <p>
            Grupo Stella © 2025
        </p>
    </footer>

    <script type="module" src="/modulo-1-autenticacion-y-registro/src/controllers/controllerLogin.js"></script>
</body>
</html>
